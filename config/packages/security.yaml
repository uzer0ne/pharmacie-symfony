security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ── Hiérarchie des rôles ──────────────────────────────────────────────────
    #
    #   ROLE_ADMIN
    #     └─ hérite de ROLE_PHARMACIEN
    #           └─ hérite de ROLE_USER
    #
    #   ROLE_GESTIONNAIRE_STOCK  (rôle indépendant, accès uniquement au stock)
    #     └─ hérite de ROLE_USER (nécessaire pour être authentifié)
    #
    role_hierarchy:
        ROLE_PHARMACIEN:          ROLE_USER
        ROLE_ADMIN:               ROLE_PHARMACIEN
        ROLE_GESTIONNAIRE_STOCK:  ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Authenticator personnalisé (gère le formulaire de login)
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

            # Se souvenir de moi
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine en secondes
                path: /

    # ── Contrôle d'accès ─────────────────────────────────────────────────────
    # ⚠️  Symfony applique la PREMIÈRE règle qui matche — ordre critique !
    access_control:
        # 1. Login : tout le monde
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # 2. Routes Stock & Produit : accessibles au gestionnaire ET aux rôles supérieurs
        - { path: ^/stock,   roles: [ROLE_GESTIONNAIRE_STOCK, ROLE_PHARMACIEN] }
        - { path: ^/produit, roles: [ROLE_GESTIONNAIRE_STOCK, ROLE_PHARMACIEN] }

        # 3. Tout le reste : ROLE_PHARMACIEN (et ROLE_ADMIN) uniquement
        #    Le gestionnaire de stock ne peut PAS accéder aux ventes, patients, ordonnances, etc.
        - { path: ^/, roles: ROLE_PHARMACIEN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
