security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ── Hiérarchie des rôles ──────────────────────────────────────────────────
    #
    #   ROLE_PHARMACIEN (Le gérant/patron)
    #     └─ hérite de ROLE_GESTIONNAIRE_STOCK
    #     └─ hérite de ROLE_CAISSIER
    #
    #   ROLE_GESTIONNAIRE_STOCK  (accès au stock et produits)
    #   ROLE_CAISSIER            (accès aux ventes, ordonnances, patients)
    #
    role_hierarchy:
        ROLE_CAISSIER:            ROLE_USER
        ROLE_GESTIONNAIRE_STOCK:  ROLE_USER
        ROLE_PHARMACIEN:          [ROLE_CAISSIER, ROLE_GESTIONNAIRE_STOCK]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker

            # Authenticator personnalisé (gère le formulaire de login)
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

            # Se souvenir de moi
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine en secondes
                path: /

    # ── Contrôle d'accès ─────────────────────────────────────────────────────
    # ⚠️  Symfony applique la PREMIÈRE règle qui matche — ordre critique !
    access_control:
        # 1. Login et Logout : tout le monde
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }

        # 2. Gestion des produits et stocks (Gestionnaire et Pharmacien)
        - { path: ^/produit/new, roles: ROLE_GESTIONNAIRE_STOCK }
        - { path: ^/produit/[^/]+/edit, roles: ROLE_GESTIONNAIRE_STOCK }
        - { path: ^/produit/[^/]+$, methods: [POST, DELETE], roles: ROLE_GESTIONNAIRE_STOCK }
        - { path: ^/stock, roles: ROLE_GESTIONNAIRE_STOCK }
        - { path: ^/mouvements-stock, roles: ROLE_GESTIONNAIRE_STOCK }

        # 3. Accès au catalogue (Lecture seule pour caissier)
        - { path: ^/produit, roles: [ROLE_GESTIONNAIRE_STOCK, ROLE_CAISSIER] }

        # 4. Caissier : Ventes, Patients, Ordonnances, Mutuelles, Médecins
        - { path: ^/vente, roles: ROLE_CAISSIER }
        - { path: ^/patient, roles: ROLE_CAISSIER }
        - { path: ^/ordonnance, roles: ROLE_CAISSIER }
        - { path: ^/mutuelle, roles: ROLE_CAISSIER }
        - { path: ^/medecin, roles: ROLE_CAISSIER }

        # 5. Dashboard et tout le reste : Pharmacien
        - { path: ^/, roles: ROLE_PHARMACIEN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
