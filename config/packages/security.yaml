security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Hiérarchie des rôles : ROLE_ADMIN hérite de ROLE_PHARMACIEN qui hérite de ROLE_USER
    role_hierarchy:
        ROLE_PHARMACIEN: ROLE_USER
        ROLE_ADMIN: ROLE_PHARMACIEN

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Authenticator personnalisé (gère le formulaire de login)
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

            # Se souvenir de moi
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 1 semaine en secondes
                path: /

    # Contrôle d'accès — la PREMIÈRE règle qui matche est appliquée
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
